services:
  - type: web
    name: puzzle-party-server
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: "https://puzzle-alpha-peach.vercel.app" # 끝에 슬래시(/) 붙이면 안 됨 — Origin 헤더엔 슬래시 없음
