<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 노치/홈 바 영역까지 화면을 쓰고, 가려지는 곳은 CSS의 env(safe-area-inset-*)로 피한다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1018" />
    <title>퍼즐 파티</title>
    <meta name="description" content="사진 한 장으로 친구들과 실시간으로 함께 맞추는 직소 퍼즐" />

    <!-- 홈 화면에 추가하면 주소창 없는 전체 화면 앱처럼 열린다. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="퍼즐 파티" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
